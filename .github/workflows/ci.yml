name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (macOS, Apple Silicon)
    # macos-15 ships Xcode 16 / Swift 6, required by FluidAudio 0.14.1.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # Also emits a digest of the toolchain for the build cache below to key
      # on. This has to stay ahead of that step, and after Xcode selection.
      - name: Show Swift version
        id: swift
        run: |
          swift --version
          echo "id=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      # Downloaded sources. Portable across images and toolchains, so a stale
      # hit here is harmless and a prefix fallback is worth having.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # Build output. Not portable: `target/` holds both the Rust binaries and
      # the Swift staticlib they link against (build.rs builds it under
      # `$OUT_DIR/swift-build`). It is specific to the image and to the Swift
      # and Rust toolchains that produced it, hence the digests in the key.
      #
      # Hence: no restore-keys. A prefix fallback is what makes a cache unsound
      # here — it hands the job the *nearest* build tree rather than a matching
      # one, and `runner.os` is "macOS" for every macOS image, so a macos-14
      # tree would restore into a macos-15 job. Rebuilding takes well under a
      # minute; debugging a binary linked on another image does not.
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: target
          # macos-15 is the `runs-on` above — keep the two in step.
          key: build-macos-15-${{ runner.arch }}-rust${{ steps.rust.outputs.cachekey }}-swift${{ steps.swift.outputs.id }}-${{ hashFiles('**/Cargo.lock', 'Package.resolved') }}

      - name: Build library
        run: cargo build --lib

      - name: Run FFI integration tests
        run: cargo test --test ffi_bindings

      - name: Run library unit tests
        run: cargo test --lib
